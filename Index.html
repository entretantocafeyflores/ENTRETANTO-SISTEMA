<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Café · Gestión</title>
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>

<main id="login" class="centro" hidden>
  <form id="loginForm" class="tarjeta">
    <h1>Ingresar</h1>
    <label>Email <input id="email" type="email" autocomplete="username" required></label>
    <label>Contraseña <input id="password" type="password" autocomplete="current-password" required></label>
    <p id="loginError" class="error" role="alert"></p>
    <button class="principal">Ingresar</button>
  </form>
</main>

<div id="app" hidden>
  <header class="barra">
    <strong>Café</strong>
    <nav>
      <button class="tab activa">Productos</button>
      <button class="tab" disabled title="Próximamente">Mesas</button>
      <button class="tab" disabled title="Próximamente">Compras</button>
      <button class="tab" disabled title="Próximamente">Costeo</button>
      <button class="tab" disabled title="Próximamente">Estadísticas</button>
    </nav>
    <button id="salir" class="link">Salir</button>
  </header>

  <main class="contenido">
    <section class="panel">
      <h2>Categorías</h2>
      <form id="catForm" class="fila">
        <input id="catNombre" placeholder="Ej: Cafetería, Almuerzos" required>
        <button>Agregar categoría</button>
      </form>

      <h2 id="formTitulo">Nuevo producto</h2>
      <form id="prodForm" class="grilla">
        <input type="hidden" id="prodId">
        <label>Nombre <input id="prodNombre" required></label>
        <label>Precio <input id="prodPrecio" type="number" min="0" step="0.01" required></label>
        <label>Categoría <select id="prodCat"></select></label>
        <label>Tipo
          <select id="prodTipo">
            <option value="carta">Carta</option>
            <option value="almuerzo">Almuerzo</option>
            <option value="menu_del_dia">Menú del día</option>
          </select>
        </label>
        <label class="check"><input id="prodActivo" type="checkbox" checked> A la venta</label>
        <div class="fila">
          <button class="principal">Guardar producto</button>
          <button type="button" id="cancelar" class="link" hidden>Cancelar edición</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <h2>Productos</h2>
      <div id="lista"></div>
    </section>
  </main>
</div>

<p id="aviso" role="status"></p>
<script type="module" src="js/app.js"></script>
</body>
</html>
