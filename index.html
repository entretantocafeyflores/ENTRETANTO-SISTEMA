<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entretanto · Gestión</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#503C35">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Entretanto">
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>

<main id="login" class="centro" hidden>
  <form id="loginForm" class="tarjeta">
    <img class="logo" src="img/logo.png" alt="Entretanto Café y Flores">
    <h1>Ingresar</h1>
    <label>Email <input id="email" type="email" autocomplete="username" required></label>
    <label>Contraseña <input id="password" type="password" autocomplete="current-password" required></label>
    <p id="loginError" class="error" role="alert"></p>
    <button class="principal">Ingresar</button>
  </form>
</main>

<div id="app" hidden>
  <aside class="lateral">
    <img class="logo" src="img/logo.png" alt="Entretanto Café y Flores">
    <nav id="menu" aria-label="Módulos"></nav>
    <button id="salir" class="link">Salir</button>
  </aside>

  <div class="principal-area" data-vista="productos" hidden>
    <header class="encabezado">
      <p>Carta y precios</p>
      <h1>Productos</h1>
    </header>

    <main class="contenido">
      <section class="panel">
        <h2>Categorías</h2>
        <form id="catForm" class="fila">
          <input id="catNombre" placeholder="Ej: Cafetería, Almuerzos" required>
          <button>Agregar categoría</button>
        </form>

        <h2 id="formTitulo">Nuevo producto</h2>
        <form id="prodForm" class="grilla">
          <input type="hidden" id="prodId">
          <label>Nombre <input id="prodNombre" required></label>
          <label>Precio <input id="prodPrecio" type="number" min="0" step="0.01" required></label>
          <label>Categoría <select id="prodCat"></select></label>
          <label>Tipo
            <select id="prodTipo">
              <option value="carta">Carta</option>
              <option value="almuerzo">Almuerzo</option>
              <option value="menu_del_dia">Menú del día</option>
            </select>
          </label>
          <label class="check"><input id="prodActivo" type="checkbox" checked> A la venta</label>
          <div class="fila">
            <button class="principal">Guardar producto</button>
            <button type="button" id="cancelar" class="link" hidden>Cancelar edición</button>
          </div>
        </form>
      </section>

      <section class="panel">
        <h2>Productos</h2>
        <div id="lista"></div>
      </section>
    </main>
  </div>

  <div class="principal-area" data-vista="sinacceso" hidden>
    <header class="encabezado">
      <p>Entretanto</p>
      <h1>Todavía no hay nada acá</h1>
    </header>
    <main class="contenido">
      <section class="panel">
        <p class="vacio">Tu usuario todavía no tiene pantallas habilitadas. Pedile a un administrador que te dé acceso.</p>
      </section>
    </main>
  </div>
</div>

<p id="aviso" role="status"></p>
<script type="module" src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
